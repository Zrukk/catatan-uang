<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💰 Catatan Uang</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
  <header>
    <h1>💰 Catatan Uang</h1>
    <p>Multi dompet • Multi kurensi • Jajan & Tabungan</p>
  </header>

  <!-- DOMPET & SALDO -->
  <div class="card">
    <div class="section-header">
      <h3>💼 Dompet & Saldo</h3>
      <button class="btn-small" onclick="toggleWalletForm()">+ Dompet</button>
    </div>

    <div class="total-box">
      <div class="total-label">Total Saldo (perkiraan IDR)</div>
      <div class="total-amount" id="totalBalance">Rp 0</div>
      <div class="total-note">*Konversi pakai kurs perkiraan</div>
    </div>

    <div id="walletForm" class="wallet-form" style="display:none">
      <input type="text" id="walletName" placeholder="Nama dompet (contoh: Cash)">
      <select id="walletCurrency">
        <option value="IDR">🇮🇩 IDR (Rp)</option>
        <option value="USD">🇺🇸 USD ($)</option>
        <option value="EUR">🇪🇺 EUR (€)</option>
        <option value="SGD">🇸🇬 SGD (S$)</option>
        <option value="MYR">🇲🇾 MYR (RM)</option>
        <option value="GBP">🇬🇧 GBP (£)</option>
        <option value="JPY">🇯🇵 JPY (¥)</option>
      </select>
      <select id="walletIcon" class="full">
        <option value="💵">💵 Uang Tunai / Cash</option>
        <option value="📱">📱 E-Wallet (GoPay/OVO/Dana)</option>
        <option value="🏦">🏦 Rekening Bank</option>
        <option value="💳">💳 Kartu Kredit/Debit</option>
        <option value="💰">💰 Lainnya</option>
      </select>
      <div class="btn-row">
        <button class="btn-save" onclick="addWallet()">Simpan</button>
        <button class="btn-cancel" onclick="toggleWalletForm()">Batal</button>
      </div>
    </div>

    <div class="wallet-list" id="walletList"></div>
  </div>

  <!-- UANG JAJAN & TABUNGAN -->
  <div class="pot-grid">
    <div class="card pot-card jajan">
      <div class="pot-header">
        <h3>🍪 Uang Jajan</h3>
        <select class="pot-currency-select" id="jajanCurrency"></select>
      </div>
      <div class="pot-amount" id="jajanDisplay">Rp 0</div>
      <div class="pot-form">
        <input type="number" id="jajanInput" placeholder="Jumlah" min="0">
        <button class="pot-btn add" onclick="updatePot('jajan', 1)" title="Tambah">+</button>
        <button class="pot-btn sub" onclick="updatePot('jajan', -1)" title="Kurangi">−</button>
      </div>
    </div>

    <div class="card pot-card tabungan">
      <div class="pot-header">
        <h3>🏦 Tabungan</h3>
        <select class="pot-currency-select" id="tabunganCurrency"></select>
      </div>
      <div class="pot-amount" id="tabunganDisplay">Rp 0</div>
      <div class="pot-form">
        <input type="number" id="tabunganInput" placeholder="Jumlah" min="0">
        <button class="pot-btn add" onclick="updatePot('tabungan', 1)" title="Tambah">+</button>
        <button class="pot-btn sub" onclick="updatePot('tabungan', -1)" title="Kurangi">−</button>
      </div>
    </div>
  </div>

  <!-- TAMBAH TRANSAKSI -->
  <div class="card">
    <h3>➕ Tambah Transaksi</h3>
    <div class="type-toggle">
      <button class="income-btn active" data-type="income">💵 Pemasukan</button>
      <button class="expense-btn" data-type="expense">💸 Pengeluaran</button>
    </div>
    <form id="form" class="form-grid">
      <input type="text" id="desc" placeholder="Keterangan (contoh: Makan siang)" required class="full">
      <div class="amount-input">
        <span class="curr-prefix" id="formCurrPrefix">Rp</span>
        <input type="number" id="amount" placeholder="Jumlah" min="1" required>
      </div>
      <select id="wallet"></select>
      <select id="category">
        <option value="Makanan">🍔 Makanan</option>
        <option value="Transportasi">🚗 Transportasi</option>
        <option value="Belanja">🛍️ Belanja</option>
        <option value="Tagihan">📄 Tagihan</option>
        <option value="Hiburan">🎮 Hiburan</option>
        <option value="Kesehatan">💊 Kesehatan</option>
        <option value="Gaji">💼 Gaji</option>
        <option value="Bonus">🎁 Bonus</option>
        <option value="Lainnya">📦 Lainnya</option>
      </select>
      <input type="date" id="date" required>
      <button type="submit" class="btn-submit full">Simpan Transaksi</button>
    </form>
  </div>

  <!-- FILTER -->
  <div class="card">
    <h3>🔍 Filter</h3>
    <div class="filters">
      <select id="filterType">
        <option value="all">Semua Tipe</option>
        <option value="income">Pemasukan</option>
        <option value="expense">Pengeluaran</option>
      </select>
      <select id="filterWallet"><option value="all">Semua Dompet</option></select>
      <select id="filterCategory"><option value="all">Semua Kategori</option></select>
      <button class="btn-clear" id="clearAll">🗑️ Hapus Semua</button>
    </div>
  </div>

  <!-- RIWAYAT -->
  <div class="card">
    <h3>📋 Riwayat Transaksi</h3>
    <div class="transaction-list" id="list"></div>
  </div>
</div>

<!-- Scripts (urutan PENTING!) -->
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/state.js"></script>
<script src="js/wallets.js"></script>
<script src="js/pots.js"></script>
<script src="js/transactions.js"></script>
<script src="js/render.js"></script>
<script src="js/app.js"></script>
</body>
  </html>
